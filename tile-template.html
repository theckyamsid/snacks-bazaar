<template id="productTileTemplate">
    <article class="product-card" data-product-card>
        <div
            class="product-card-open"
            data-open-product
            role="button"
            tabindex="0"
            aria-label="View product details"
        >
            <div class="product-image">
                <span class="product-number" data-product-number></span>
                <img data-product-image alt="" loading="lazy" />
                <div class="image-fallback" data-image-fallback hidden></div>
                <span class="product-category" data-product-category></span>
            </div>
            <div class="product-info">
                <h3 class="product-title" data-product-name></h3>
                <p class="product-description" data-product-description></p>
            </div>
        </div>
        <div class="product-buy-row">
            <label class="card-pack-select"
                ><span class="visually-hidden">Pack size</span
                ><select data-pack-select aria-label="Choose pack size"></select
            ></label>
            <strong class="product-price" data-product-price></strong>
            <button
                class="add-button"
                type="button"
                data-add-to-cart
                aria-label="Add to bag"
            >
                +
            </button>
        </div>
    </article>
</template>
